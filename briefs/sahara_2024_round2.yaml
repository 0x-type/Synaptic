known_literature:
- 'Weather and Climate Dynamics (2026): Synoptic drivers of the August 2024 record-breaking rainfall in the Chadian Sahara
  (CHIRPS, TAMSAT, ERA5: 100-400 mm over Tibesti/Borkou/Ennedi, +8 sigma; a moister ''new normal'' since the early 2000s).
  Rainfall and meteorology only, no water storage.'
- 'Journal of Hydrology (2026): Long-term and interannual variability of African terrestrial water storage revealed by
  GRACE/GRACE-FO and models (Apr 2002-Dec 2024; continental TWS +96 Gt/yr with acceleration; lakes drive the gains; land-model
  soil moisture declines; ENSO/IOD modes). Long-term trends, not the 2024 event or its persistence; ends Dec 2024.'
- 'ISPRS Archives (2026): Estimating long-term groundwater storage change in the Chad Basin, Nigeria, using GRACE/GRACE-FO
  and GLDAS (basin TWS +5.9 mm/yr; groundwater not rising). Long-term trend.'
- 'Land (2025): Lake Iriqui''s remarkable revival after the September 2024 storms (Google Earth Engine surface water
  extent >80 km2).'
- 'EGU (2025): Meteorological ingredients of heavy precipitation and subsequent lake-filling episodes in the northwestern
  Sahara; EGU24: The hydrometeorological ingredients needed to fill dry Saharan lakes (Sebkha el Melah).'
- 'Rodell et al. (2018) Nature: Emerging trends in global freshwater availability (GRACE 2002-2016).'
