  - "Ait Dhmane et al. (2024) Frontiers in Water: Spatiotemporal characterization and hydrological impact of drought patterns in northwestern Morocco (Bouregreg; GRACE TWS falls with rising evaporative demand while rainfall is stable; anthropogenic factors not separated)"
  - "Dynamics of seasonal snowpack over the High Atlas (2022, HAL insu-03668283): High Atlas snow and its role in recharge"
  - "CESBIO (2022-2023): Snow drought in the High Atlas of Morocco (MODIS snow cover)"
  - "Environmental Research Letters (2023): Persistent anticyclonic conditions and climate change exacerbated the exceptional 2022 European-Mediterranean drought"
  - "Snowpack and groundwater recharge in the Atlas mountains: new evidence and key drivers"
  - "JRC Global Drought Observatory reports (2023-2024): drought in the Maghreb"
