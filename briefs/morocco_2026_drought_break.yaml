  - "Ait Dhmane et al. (2024) Frontiers in Water: drought patterns in northwestern Morocco (Bouregreg; GRACE storage falls with rising evaporative demand while rainfall is stable)"
  - "(2025) Evaluation of GRACE and GRACE-FO derived products for water storage assessment in Moroccan aquifers: analysis of drought"
  - "(2026) Groundwater storage depletion and contamination trade-offs under contrasting irrigation practices in drought-stressed Morocco"
  - "(2026) Hybrid ensemble learning for TWSA prediction in water-stressed regions: Casablanca-Settat, Morocco"
  - "(2026) A multi-source geospatial and meteorological analysis of the 2026 Gharb Plain floods, Morocco; (2026) SAR-based flood detection in the Loukkos floodplain (floods mapped, storage not weighed)"
  - "Environmental Research Letters (2023): persistent anticyclonic conditions and the 2022 European-Mediterranean drought"
